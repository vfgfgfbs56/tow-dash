
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Повторение тем</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #181a20; color: #f1f1f3; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { width: 100%; max-width: 480px; text-align: center; }
    #counter { color: #a4a7b1; font-size: 15px; margin-bottom: 24px; }
    #topic { font-size: clamp(25px, 7vw, 38px); font-weight: 600; overflow-wrap: anywhere; min-height: 120px; display: flex; align-items: center; justify-content: center; }
    button { width: 100%; padding: 17px; margin-top: 30px; border: 0; border-radius: 12px; background: #343a46; color: white; font: inherit; font-size: 18px; cursor: pointer; }
    button:active { background: #485161; }
    button:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <main>
    <div id="counter"></div>
    <div id="topic"></div>
    <button id="next">Дальше</button>
  </main>
  <script>
    const topics = [
      "Поверхностное натяжение и механизм его образования",
      "Смачивание",
      "Капиллярные явления",
      "Параметры состояния газа",
      "Термодинамический процесс и равновесие",
      "Уравнение Клапейрона и Менделеева-Клапейрона",
      "Уравнение неразрывности",
      "Уравнение Бернулли",
      "Режимы течения жидкости"
    ];

    const shuffled = [...topics];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    const topicEl = document.getElementById('topic');
    const counterEl = document.getElementById('counter');
    const button = document.getElementById('next');
    let index = 0;

    function show() {
      if (index >= shuffled.length) {
        topicEl.textContent = 'Все темы закончились!';
        counterEl.textContent = `Пройдено: ${shuffled.length} из ${shuffled.length}`;
        button.disabled = true;
        return;
      }
      topicEl.textContent = shuffled[index];
      counterEl.textContent = `${index + 1} из ${shuffled.length}`;
    }

    button.addEventListener('click', () => { index++; show(); });
    show();
  </script>
</body>
</html>
